name: Windows desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-lock.txt
            desktop/requirements.txt
      - name: Install build and test dependencies
        run: python -m pip install -r backend/requirements-lock.txt -r desktop/requirements.txt
      - name: Existing processing tests
        run: python scripts/verify.py
      - name: Native window and file workflow
        run: python desktop/launch.py --self-test build/source-test
      - name: Package standalone executable
        run: python scripts/build_desktop.py
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\DataMapStudio.exe" -ArgumentList "--self-test", "build/packaged-test" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw "Packaged executable test timed out"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "build/packaged-test/failure.txt") { Get-Content "build/packaged-test/failure.txt" }
            throw "Packaged executable test failed"
          }
          Get-Content "build/packaged-test/self-test.json"
      - name: Verify the packaged distribution has no web runtime
        shell: pwsh
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer -l dist/DataMapStudio.exe > build/archive-contents.txt
          python -c "from pathlib import Path; p=Path('build/archive-contents.txt').read_text(); assert 'QtWebEngine' not in p; assert 'uvicorn' not in p"
      - name: Capture native preview for review
        run: python -c "import base64,textwrap; from pathlib import Path; s=base64.b64encode(Path('build/packaged-test/native-window.png').read_bytes()).decode(); [print('DATAMAP_PREVIEW_CHUNK:'+c) for c in textwrap.wrap(s,4096)]"
      - name: Save standalone application
        uses: actions/upload-artifact@v4
        with:
          name: DataMapStudio-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-verification
          path: |
            build/source-test/self-test.json
            build/source-test/failure.txt
            build/source-test/native-window.png
            build/packaged-test/self-test.json
            build/packaged-test/failure.txt
            build/packaged-test/native-window.png
            build/archive-contents.txt
            build/desktop/DataMapStudio/warn-DataMapStudio.txt
          if-no-files-found: ignore
